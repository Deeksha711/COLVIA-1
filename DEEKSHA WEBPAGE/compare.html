<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Compare Colleges | COLVIA</title>

    <link rel="stylesheet" href="compare.css">

</head>

<body>

    <!-- Navigation -->

    <nav class="navigation">

        <button
            class="hamburger"
            id="hamburger"
            aria-label="Open menu"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>


        <div class="nav-links">

            <a href="home.html">
                Home
            </a>

            <a href="college.html">
                College
            </a>

            <a
                href="compare.html"
                class="active"
            >
                Compare
            </a>

        </div>


        <div
            class="hamburger-menu"
            id="hamburgerMenu"

            <a href="preferences.html">
                Selected Preferences
            </a>

            <a href="about.html">
                About COLVIA
            </a>

            <a href="privacy.html">
                Privacy
            </a>

            <a href="help.html">
                Help & Feedback
            </a>

        </div>

    </nav>


    <!-- Main -->

    <main class="compare-page">

        <section class="page-heading">

            <p>COLLEGE COMPARISON</p>

            <h1>Compare Colleges</h1>

            <span>
                Select two colleges to compare.
            </span>

        </section>


        <!-- Selection area -->

        <section
            class="selection-section"
            id="selectionSection"
        >

            <div class="selection-heading">

                <h2>
                    Select Colleges
                </h2>

                <span id="selectionCount">
                    0 / 2 selected
                </span>

            </div>


            <div
                class="selection-grid"
                id="selectionGrid"
            >

                <!-- Recommended college cards
                     will be inserted here -->

            </div>


            <p
                class="selection-message"
                id="selectionMessage"
            ></p>


            <button
                class="compare-now-button"
                id="compareNowButton"
                disabled
            >
                Compare Selected Colleges
            </button>

        </section>


        <!-- Comparison -->

        <section
            class="comparison-section"
            id="comparisonSection"
        >

            <div class="comparison-heading">

                <p>COMPARISON</p>

                <h2>
                    College Comparison
                </h2>

            </div>


            <div
                class="comparison-table"
                id="comparisonTable"
            >

                <!-- Backend data will be inserted here -->

            </div>

        </section>

    </main>


    <script src="compare.js"></script>

</body>

</html>
