<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course | COLVIA</title>
    <link rel="stylesheet" href="course.css">
</head>

<body>

    <!-- Navigation -->

    <nav class="navigation">

        <button class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="colleges.html" class="active">Colleges</a>
            <a href="compare.html">Compare</a>
        </div>

        <div class="hamburger-menu" id="hamburgerMenu">
            <a href="student-profile.html">Student Profile</a>
            <a href="preferences.html">Selected Preferences</a>
            <a href="about.html">About COLVIA</a>
            <a href="privacy.html">Privacy</a>
            <a href="help.html">Help & Feedback</a>
        </div>

    </nav>


    <!-- Course -->

    <main>

        <section class="course-header">

            <div class="triangle-area">
                <div class="triangle"></div>
            </div>

            <div class="course-heading">

                <p class="course-label">COURSE</p>

                <h1 id="courseName">
                    Course Name
                </h1>

                <p id="collegeName" class="college-name">
                    College Name
                </p>

            </div>

        </section>


        <!-- Course Information -->

        <section class="course-section">

            <h2>Course Information</h2>

            <div class="course-details">

                <div class="detail-item">
                    <span>Eligibility</span>
                    <strong id="eligibility">—</strong>
                </div>

                <div class="detail-item">
                    <span>Minimum Percentage</span>
                    <strong id="minimumPercentage">—</strong>
                </div>

                <div class="detail-item">
                    <span>Duration</span>
                    <strong id="duration">—</strong>
                </div>

                <div class="detail-item">
                    <span>Fee</span>
                    <strong id="fee">—</strong>
                </div>

                <div class="detail-item">
                    <span>Fee Period</span>
                    <strong id="feePeriod">—</strong>
                </div>

                <div class="detail-item">
                    <span>Academic Year</span>
                    <strong id="academicYear">—</strong>
                </div>

                <div class="detail-item">
                    <span>Fee Type</span>
                    <strong id="feeType">—</strong>
                </div>

            </div>

        </section>


        <!-- Verification -->

        <section class="verification-section">

            <div>
                <h2>Information Source</h2>

                <p>
                    Source:
                    <span id="source">—</span>
                </p>

                <p>
                    Last verified:
                    <span id="lastVerified">—</span>
                </p>
            </div>

        </section>

    </main>


    <script src="course.js"></script>

</body>
</html>
